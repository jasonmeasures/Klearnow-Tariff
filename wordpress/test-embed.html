<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KlearNow — Duty stack embed test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #0e2638; }
    header { background: #11304c; color: #fff; padding: 1.25rem 1.5rem; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: .35rem 0 0; opacity: .85; font-size: .9rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .note { background: #fff; border: 1px solid #d8dee4; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; font-size: .9rem; line-height: 1.5; }
    code { background: #eef2f6; padding: .1em .35em; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>klearnow.ai.com — embed test</h1>
    <p>Same iframe contract as the WordPress shortcode <code>[klearnow_duty_stack]</code>.</p>
  </header>
  <main>
    <div class="note">
      Parent origin must be listed in backend <code>FRAME_ANCESTORS</code>
      (this page: <code id="origin"></code>).
      Tariff SPA: <code id="src"></code>
    </div>
    <div class="kn-duty-stack-embed" style="position:relative;width:100%;min-height:900px">
      <iframe
        id="embed"
        title="KlearNow Duty stack"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="clipboard-write"
        style="border:0;width:100%;height:900px;border-radius:12px;background:#003F5B"
      ></iframe>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const tariff = params.get("tariff") || "http://localhost:3000";
    const src = tariff.replace(/\/$/, "") + "/?embed=1&surface=external";
    document.getElementById("embed").src = src;
    document.getElementById("src").textContent = src;
    document.getElementById("origin").textContent = location.origin;
  </script>
</body>
</html>
